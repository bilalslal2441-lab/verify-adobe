<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Adobe Expert Verification</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    text-align: center;
    background: url('https://e7.pngegg.com/pngimages/576/126/png-clipart-logo-brand-adobe-certified-expert-adobe-systems-ibm-watson-logo-angle-text.png');
    background-size: 200px;
}

.container {
    margin-top: 80px;
}

h1 {
    color: white;
    text-shadow: 0 0 10px black;
}

input {
    padding: 15px;
    width: 320px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    margin: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}

.success {
    color: #00ff88;
    font-size: 22px;
}

.fail {
    color: red;
    font-size: 22px;
}

.card {
    margin-top: 30px;
    display: none;
    background: black;
    color: white;
    width: 420px;
    margin-left: auto;
    margin-right: auto;
    padding: 20px;
    border-radius: 20px;
}

.card img {
    width: 100%;
    border-radius: 10px;
    margin-top: 15px;
}

.actions button {
    background: #007bff;
    color: white;
}
</style>

</head>

<body>

<div class="container">

    <h1>🔎 Adobe Expert Verification</h1>

    <input type="text" id="code" placeholder="Enter Certificate Code">
    <br>

    <button onclick="search()">Search</button>

    <div id="status"></div>

    <div class="card" id="result">

        <h2>
            Bilal Husain Slal 
            <span class="success">✔</span>
        </h2>

        <p>74TB-ZkAQ</p>
        <p>18-4-1989</p>

        <!-- ✅ صورة الشهادة -->
        <img id="certImage" src="https://i.postimg.cc/hv8d6vTJ/74TB-Zk-AQ.png">

        <div class="actions">
            <button onclick="viewImage()">View</button>
            <button onclick="downloadImage()">Download</button>
        </div>

    </div>

</div>

<script>

let imageURL = "https://i.postimg.cc/hv8d6vTJ/74TB-Zk-AQ.png";

function search() {
    let input = document.getElementById("code").value.trim();
    let status = document.getElementById("status");

    if(input === "74TB-ZkAQ"){
        document.getElementById("result").style.display = "block";
        status.innerHTML = "<div class='success'>✔ Certificate Verified</div>";
    } else {
        document.getElementById("result").style.display = "none";
        status.innerHTML = "<div class='fail'>❌ Invalid Certificate</div>";
    }
}

function viewImage() {
    window.open(imageURL, '_blank');
}

function downloadImage() {
    let a = document.createElement("a");
    a.href = imageURL;
    a.download = "certificate.png";
    a.click();
}

</script>

</body>
</html>
